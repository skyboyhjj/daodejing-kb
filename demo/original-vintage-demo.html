    </header>

    <!-- 与真实章节相同的目标结构：js/original-vintage.js 在此处外挂增强 -->
    <div class="original-text">
        道可道，非常道。名可名，非常名。<br>
        无名天地之始，有名万物之母。<br>
        故常无欲，以观其妙；常有欲，以观其徼。<br>
        此两者同出而异名，同谓之玄。<br>
        玄之又玄，众妙之门。
    </div>

    <p class="demo-note">版本：王弼本 · 简体。demo 通过 ../js/original-vintage.js 运行时增强，与全站章节共用同一模块。</p>
